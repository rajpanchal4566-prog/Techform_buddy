version: '3.8'

services:
  techformbuddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techformbuddy-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-techformbuddy-demo-secret-key-at-least-32-chars-long}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

